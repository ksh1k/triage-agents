[project]
name = "triage-agents"
version = "0.1.0"
description = "Multi-agent security-alert triage built with Google's Agent Development Kit (ADK) and Gemini"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-adk>=2.15,<3",
    "pefile>=2024.8.26",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ziglang>=0.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["triage_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
